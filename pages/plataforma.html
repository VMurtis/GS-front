<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>plataforma</title>
    <link
      rel="shortcut icon"
      href="../imagens/icones/mundo.png"
      type="image/x-icon"
    />
  </head>
  <body class="fundo-branco">
    <header class="cabecalho">
      <nav class="container-menu">
        <input type="checkbox" id="menu" class="container__botao-menu" />
        <label for="menu" class="container__rotulo">
          <span class="cabecalho__menu-hamburguer container__imagem"></span>
        </label>
        <ul class="lista-menu">
          <li class="lista-menu__titulo">Páginas</li>
          <li class="lista-menu__item">
            <a href="../index.html" class="lista-menu__link">Página inicial</a>
          </li>
          <li class="lista-menu__item">
            <a href="./pages/integrante.html" class="lista-menu__link"
              >Integrantes</a
            >
          </li>
          <li class="lista-menu__item">
            <a href="sobre.html" class="lista-menu__link">sobre</a>
          </li>
          <li class="lista-menu__item">
            <a href="faq.html" class="lista-menu__link">FAQ</a>
          </li>
          <li class="lista-menu__item">
            <a href="contato.html" class="lista-menu__link">Contato</a>
          </li>
          <li class="lista-menu__item">
            <a href="solucao.html" class="lista-menu__link">solução</a>
          </li>
          <li class="lista-menu__item">
            <a href="plataforma.html" class="lista-menu__link">plataforma</a>
          </li>
        </ul>
      </nav>
      <div class="cabecalho__logo-container">
        <img
          src="../imagens/logos/logo-mundo.png"
          alt="Logo da Apeperia"
          class="cabecalho__logo"
        />
        <h1 class="titulo">Clear Horizon</h1>
      </div>
      <div class="container-menu">
        <a href="./pages/login.html" class="container-menu__link">
          <img
            src="../imagens/icones/Usuario.svg"
            alt="Meu perfil"
            class="container__imagem"
          />
        </a>
      </div>
    </header>
    <main class="plataforma">
      <h1 class="solucao__titulo">Simulação</h1>

      <button class="plataforma__botao" onclick="simularReciclagem()">
        Reciclar Satélite
      </button>

      <button class="plataforma__botao" onclick="simularRota()">
        Calcular Rota
      </button>

      <p id="resultado" class="plataforma__resultado"></p>
    </main>
    <footer class="footer">
      <p>© 2026 Clear Horizon - Todos os direitos reservados</p>
    </footer>
    <script src="../js/plataforma.js"></script>
  </body>
